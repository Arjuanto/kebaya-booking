[pytest]
# Folder ml-service dimasukkan ke jalur impor, supaya `pytest` dan `python -m pytest`
# sama-sama bisa menemukan paket `app` dan `src`.
pythonpath = .
testpaths = tests
# Peringatan dari Starlette 1.10 soal httpx di TestClient. Tidak memengaruhi hasil tes;
# httpx tetap didukung, jadi peringatannya disembunyikan agar keluaran tes bersih.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
